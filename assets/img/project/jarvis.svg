<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI', 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="640" height="400" fill="#0b1726"/>
  <text x="320" y="44" fill="#12D640" font-size="26" font-weight="700" text-anchor="middle" letter-spacing="4">JARVIS</text>
  <text x="320" y="70" fill="#9fb0c2" font-size="14" text-anchor="middle">Voice · Chat → Safe Windows Commands</text>

  <g font-size="14" text-anchor="middle">
    <rect x="30" y="110" width="170" height="70" rx="10" fill="#132a40" stroke="#2f4d6b"/>
    <text x="115" y="140" fill="#ffffff" font-weight="600">Wake word</text>
    <text x="115" y="162" fill="#9fb0c2" font-size="12">Vosk (offline, on PC)</text>

    <rect x="235" y="110" width="170" height="70" rx="10" fill="#132a40" stroke="#2f4d6b"/>
    <text x="320" y="140" fill="#ffffff" font-weight="600">Speech to text</text>
    <text x="320" y="162" fill="#9fb0c2" font-size="12">command only → cloud STT</text>

    <rect x="440" y="110" width="170" height="70" rx="10" fill="#132a40" stroke="#2f4d6b"/>
    <text x="525" y="140" fill="#ffffff" font-weight="600">Chat input</text>
    <text x="525" y="162" fill="#9fb0c2" font-size="12">Electron UI / REST</text>

    <rect x="130" y="215" width="380" height="70" rx="10" fill="#0f3320" stroke="#12D640"/>
    <text x="320" y="244" fill="#ffffff" font-weight="600">Hybrid agent: rules first, LLM fallback</text>
    <text x="320" y="266" fill="#b7f5c6" font-size="12">91% accuracy · 0.85 s · 60% fewer tokens</text>

    <rect x="30" y="315" width="270" height="60" rx="10" fill="#132a40" stroke="#2f4d6b"/>
    <text x="165" y="341" fill="#ffffff" font-weight="600">Allow-listed tools</text>
    <text x="165" y="361" fill="#9fb0c2" font-size="12">apps · windows · search · volume</text>

    <rect x="340" y="315" width="270" height="60" rx="10" fill="#132a40" stroke="#2f4d6b"/>
    <text x="475" y="341" fill="#ffffff" font-weight="600">CommandPlan → Result</text>
    <text x="475" y="361" fill="#9fb0c2" font-size="12">TTS reply · history · undo</text>
  </g>

  <g stroke="#5f7d99" stroke-width="2" fill="none">
    <path d="M200 145 H235"/>
    <path d="M320 180 V215"/>
    <path d="M525 180 V198 H420 V215"/>
    <path d="M250 285 V300 H165 V315"/>
    <path d="M390 285 V300 H475 V315"/>
  </g>
